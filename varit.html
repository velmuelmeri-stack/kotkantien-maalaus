<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons (ikonit) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Roboto-fontti Google Fontsista -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <!-- Oma tyylitiedosto (viimeisenä, jotta omat tyylit ohittavat Bootstrapin) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== NAVIGAATIOPALKKI ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark ">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-brush"></i> Kotkantien maalaus
            </a>
            <!-- Hampurilaisvalikon painike mobiilissa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="valikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Etusivu</a></li>
                    <li class="nav-item"><a class="nav-link" href="palvelut.html">Palvelut</a></li>
                    <li class="nav-item"><a class="nav-link active" href="varit.html">Värien testaus</a></li>
                    <li class="nav-item"><a class="nav-link" href="galleria.html">Galleria</a></li>
                    <li class="nav-item"><a class="nav-link" href="yhteystiedot.html">Yhteystiedot</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== SISÄLTÖ ===== -->
<main class="container my-5">
    <h1><i class="bi bi-palette"></i> Värien testaus</h1>
    <p>Valitse väri kummastakin paletista ja katso, miten värit sopivat yhteen.</p>

    <!-- Paletit vierekkäin -->
    <div class="row">
        <div class="col-md-6 mb-3">
            <h2>Vasen puoli</h2>
            <div id="paletti1" class="paletti"></div>
        </div>
        <div class="col-md-6 mb-3">
            <h2>Oikea puoli</h2>
            <div id="paletti2" class="paletti"></div>
        </div>
    </div>

    <!-- Yksi yhteinen suorakulmio, jonka sisällä on kaksi pintaa -->
    <div class="pinnat">
        <div id="pinta1" class="pinta"></div>
        <div id="pinta2" class="pinta"></div>
    </div>

    <!-- Valittujen värien nimet pintojen alla -->
    <div class="nimet">
        <p id="nimi1">Ei valittua väriä</p>
        <p id="nimi2">Ei valittua väriä</p>
    </div>

    <!-- Painike, joka tyhjentää molemmat pinnat -->
    <button id="tyhjenna" class="btn btn-dark">
        <i class="bi bi-eraser"></i> Tyhjennä värit
    </button>
</main>

    <!-- ===== FOOTER ===== -->
    <footer class=" text-light text-center py-3">
        <p class="mb-0">&copy; 2026 Kotkantien maalaus ja tapetointi</p>
    </footer>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS (tarvitaan esim. mobiilivalikkoon) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Oma JavaScript -->
    <script src="js/main.js"></script>
    <script src="js/varit.js"></script>
</body>
</html>
